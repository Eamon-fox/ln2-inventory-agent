name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # PySide6 GUI 测试在无显示环境需要 offscreen 平台插件。
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries (headless PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libglib2.0-0 \
            libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate version metadata
        run: python scripts/validate_version.py

      - name: Ruff check
        run: ruff check .

      - name: Unit and contract tests
        timeout-minutes: 10
        run: python -m pytest -q tests/unit tests/contract

      - name: Integration tests
        timeout-minutes: 25
        run: python -m pytest -q tests/integration
