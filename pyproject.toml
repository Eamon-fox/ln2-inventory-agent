[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowfox"
# 版本号的唯一真相源是 app_gui/version.py 的 APP_VERSION（并由
# scripts/validate_version.py 与 latest.json / CHANGELOG.md / installer.iss 交叉校验）。
# 此处保持同步；发版流程见 docs/runbooks/25-发布版本手册.md。
version = "1.3.15"
description = "SnowFox 液氮罐库存管理与 AI Copilot 桌面应用"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
readme = "README.md"

# 运行依赖与 requirements.txt 同源（后者为锁定版本的唯一安装入口）。
dependencies = [
    "PyYAML==6.0.3",
    "mistune==3.3.2",
    "PySide6==6.10.2",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
# 开发/测试依赖与 requirements-dev.txt 同源。
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "ruff==0.15.20",
    "pre-commit==4.6.0",
]

[tool.ruff]
# 兼容现状：仓库存在超长历史行（最长 724 列），故不强制行宽（见 lint.ignore 的 E501）。
line-length = 120
target-version = "py311"
# 依赖 ruff 默认排除（.venv/build/dist 等）并额外排除数据与打包产物目录。
extend-exclude = [
    "build",
    "build-py311",
    "dist",
    "snowfox_data",
    "inventories",
]

[tool.ruff.lint]
# 宽松起步：开启 E/F/W 三组，但把当前仍有存量违规的具体规则加入 ignore，
# 保证 `ruff check` 立即全绿，CI 可即刻启用。存量清零后可逐条移除 ignore 收紧。
select = ["E", "F", "W"]
ignore = [
    "E501",  # line-too-long（存量 3002，历史超长行）
    "F405",  # undefined-local-with-import-star-usage（存量 805，import *）
    "E402",  # module-import-not-at-top-of-file（存量 171，测试 sys.path 注入后再 import）
    "W293",  # blank-line-with-whitespace（存量 65）
    "F401",  # unused-import。注意：不能盲目 --fix——本仓库多处 facade 模块
             # 依赖“导入即再导出”供 import * 消费，自动删除会破坏运行时行为；
             # 清理需逐文件确认或补 noqa/__all__。
    "F841",  # unused-variable（存量 18）
    "E731",  # lambda-assignment（存量 9）
    # F821（undefined-name）与 F811（redefined-while-unused）存量已清零并移出
    # ignore——这两条能抓真实 NameError/复制粘贴 bug，新代码即刻受约束。
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# GUI/PySide6 测试需要无头渲染。这里不用 pytest-env 插件（未安装），
# 无头默认值由 tests/conftest.py 在导入期通过 QT_QPA_PLATFORM=offscreen 兜底。
addopts = "-q"
